name: واکشی مقالات

on:
  schedule:
    - cron: '0 */24 * * *'   # هر 24 ساعت
  workflow_dispatch:         # برای اجرای دستی

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: نصب کتابخانه‌ها
        run: pip install feedparser newspaper3k lxml_html_clean python-docx

      - name: اجرای اسکریپت
        run: python rss_fetcher.py

      - name: ثبت تغییرات در مخزن
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add -A
          git diff --staged --quiet || git commit -m "📰 بروزرسانی مقالات"
          git pull --rebase origin main
          git push
